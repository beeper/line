name: CI

on:
  push:
  pull_request:

env:
  GOTOOLCHAIN: local
  CI_REGISTRY_IMAGE: "${{ secrets.CI_REGISTRY }}/bridge/line"
  BEEPER_BRIDGE_TYPE: line

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
    name: Lint with ${{ matrix.go-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install libolm
        run: sudo apt-get install libolm-dev

      - name: Install dependencies
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          export PATH="$HOME/go/bin:$PATH"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]
    name: Build ${{ matrix.go-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install libolm
        run: sudo apt-get install libolm-dev

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted. Please run 'go fmt ./...'"
            exit 1
          fi

      - name: Build
        run: go build -v ./...

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: github.event_name == 'push' && github.repository == 'beeper/line'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CI_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}

      - name: Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          cache-from: type=gha,scope=line-linux-amd64
          cache-to: type=gha,mode=max,scope=line-linux-amd64
          pull: true
          file: Dockerfile
          tags: |
            ${{ github.event_name == 'push' && github.repository == 'beeper/line' && format('{0}:{1}', env.CI_REGISTRY_IMAGE, github.sha) || format('line-ci:{0}', github.sha) }}
            ${{ github.event_name == 'push' && github.repository == 'beeper/line' && format('{0}:{1}-amd64', env.CI_REGISTRY_IMAGE, github.sha) || format('line-ci:{0}-amd64', github.sha) }}
          push: ${{ github.event_name == 'push' && github.repository == 'beeper/line' }}

  deploy-docker:
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - build-docker
    if: github.ref == 'refs/heads/main' && github.repository == 'beeper/line'
    steps:
      - name: Login to Beeper Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CI_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}

      - uses: beeper/docker-retag-push-latest@main
        with:
          image: ${{ env.CI_REGISTRY_IMAGE }}

      - name: Run bridge CD tool
        uses: beeper/bridge-cd-tool@main
        env:
          CI_REGISTRY: "${{ secrets.CI_REGISTRY }}"
          BEEPER_DEV_ADMIN_API_URL: "${{ secrets.BEEPER_DEV_ADMIN_API_URL }}"
          BEEPER_STAGING_ADMIN_API_URL: "${{ secrets.BEEPER_STAGING_ADMIN_API_URL }}"
          BEEPER_PROD_ADMIN_API_URL: "${{ secrets.BEEPER_PROD_ADMIN_API_URL }}"
          BEEPER_DEV_ADMIN_NIGHTLY_PASS: "${{ secrets.BEEPER_DEV_ADMIN_NIGHTLY_PASS }}"
          BEEPER_STAGING_ADMIN_NIGHTLY_PASS: "${{ secrets.BEEPER_STAGING_ADMIN_NIGHTLY_PASS }}"
          BEEPER_PROD_ADMIN_NIGHTLY_PASS: "${{ secrets.BEEPER_PROD_ADMIN_NIGHTLY_PASS }}"

  test:
    name: Test (${{ matrix.mode }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race, coverage]
    env:
      GOMAXPROCS: "4"
      TEST_PACKAGE_PARALLELISM: "2"
      TEST_TIMEOUT: 10m
      TEST_JSON: "1"
      TEST_OUTPUT_DIR: ${{ github.workspace }}/.opencode-work/test-ci-${{ matrix.mode }}
      GOPATH: ${{ github.workspace }}/.opencode-work/gopath
      GOCACHE: ${{ github.workspace }}/.opencode-work/go-build-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: "1.26"
          cache: false
      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev
      - name: Identify native test ABI
        id: native
        run: echo "abi=$(gcc -dumpfullversion)-$(pkg-config --modversion olm)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ${{ env.GOPATH }}/pkg/mod
          key: test-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
      - name: Cache compiled tests by instrumentation mode
        uses: actions/cache@v4
        with:
          path: ${{ env.GOCACHE }}
          key: test-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ steps.native.outputs.abi }}-${{ matrix.mode }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go', 'pkg/ltsm/data/*') }}
          restore-keys: |
            test-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ steps.native.outputs.abi }}-${{ matrix.mode }}-${{ hashFiles('go.sum') }}-
      - name: Verify LINE login aliases for release
        if: matrix.mode == 'normal'
        run: TEST_RUN='^TestRegisteredLineLoginCommandDispatch$' bash scripts/test.sh fast ./pkg/connector
      - name: Run validation
        run: bash scripts/test.sh "${{ matrix.mode }}"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.mode }}
          path: |
            ${{ env.TEST_OUTPUT_DIR }}/coverage.out
          if-no-files-found: warn
          retention-days: 7
